<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thala 7. | Checkout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-logo" href="index.html">Thala <span>7.</span></a>
      <nav class="nav-links" aria-label="Primary Navigation">
        <a class="nav-link " href="index.html">Home</a>
        <a class="nav-link " href="product.html">Product</a>
        <a class="nav-link " href="cart.html">Cart</a>
        <a class="nav-link active" href="checkout.html">Checkout</a>
      </nav>
      <div class="header-actions">
        <div class="search-box">
          <input type="text" placeholder="Search shoes..." aria-label="Search shoes" />
        </div>
        <a class="cart-icon-btn" href="cart.html" aria-label="Shopping Cart">
          <span>&#128722;</span>
          <span class="cart-badge" id="header-cart-badge">2</span>
        </a>
        <div class="avatar-circle" title="User">V</div>
      </div>
    </div>
  </header>
  <main>
    <div class="split-layout">
      <div class="left-container">
        <h1 class="page-heading">Checkout</h1>
        <div class="checkout-card">
          <h3>Contact Details</h3>
          <div class="form-group"><label for="checkout-email">Email ID</label><input type="email" id="checkout-email" placeholder="vineet@example.com" /></div>
        </div>
        <div class="checkout-card">
          <h3>Payment</h3>
          <div class="payment-tabs">
            <button type="button" class="payment-tab active" onclick="selectPaymentMethod(this, 'cards')">Cards</button>
            <button type="button" class="payment-tab" onclick="selectPaymentMethod(this, 'crypto')">Crypto</button>
            <button type="button" class="payment-tab" onclick="selectPaymentMethod(this, 'bank')">Bank / UPI</button>
          </div>
          <div id="payment-fields-cards">
            <div class="form-group"><label for="card-number">Card Number</label><input type="text" id="card-number" placeholder="1234 5678 9012 3456" /></div>
            <div class="form-row-2">
              <div class="form-group"><label for="card-expiry">Expiry</label><input type="text" id="card-expiry" placeholder="MM / YY" /></div>
              <div class="form-group"><label for="card-cvv">CVV</label><input type="password" id="card-cvv" placeholder="123" /></div>
            </div>
            <div class="form-row-2">
              <div class="form-group"><label for="card-country">Country</label><select id="card-country"><option>India</option><option>United States</option></select></div>
              <div class="form-group"><label for="card-zip">Zip Code</label><input type="text" id="card-zip" placeholder="226001" /></div>
            </div>
          </div>
          <div id="payment-fields-crypto" style="display:none;"><div class="form-group"><label>Wallet Address</label><input type="text" placeholder="0x71C...9A2F" /></div></div>
          <div id="payment-fields-bank" style="display:none;"><div class="form-group"><label>UPI ID</label><input type="text" placeholder="username@okaxis" /></div></div>
        </div>
      </div>
      <div class="right-container">
        <div class="summary-card">
          <h2>Order Summary</h2>
          <div class="coupon-row">
            <input type="text" id="checkout-coupon" placeholder="Enter coupon code" />
            <button class="btn-blue" type="button" onclick="applyCoupon('checkout-coupon')">Apply Coupon</button>
          </div>
          <div class="summary-lines">
            <div class="summary-line"><span>Sub Total</span><span id="checkout-subtotal">₹0</span></div>
            <div class="summary-line"><span>Taxes</span><span id="checkout-taxes">₹100</span></div>
            <div class="summary-line"><span>Discount</span><span id="checkout-discount">₹0</span></div>
            <div class="summary-line total"><span>Total</span><span id="checkout-total">₹0</span></div>
          </div>
          <button class="btn-primary pay-now-full" type="button" onclick="alert('Order placed successfully!')">Pay Now&nbsp;<span id="checkout-pay-amount">₹0</span></button>
          <div class="trust-badges"><span class="badge-chip">Secured by Razorpay</span></div>
        </div>
      </div>
    </div>
  </main>
  <footer>Thala 7. &mdash; CSS Mini Project</footer>
  <script src="app.js"></script>
</body>
</html>
